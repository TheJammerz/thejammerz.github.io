name: Mise à jour avis Google

# Recopie 1x/jour dans index.html les avis 5/5 avec commentaire de la fiche
# Google Business Profile. Les identifiants restent dans les secrets du dépôt :
# ils n'apparaissent JAMAIS dans la page publiée.
#
# On passe par l'API « Google Business Profile » (gratuite, elle sert à gérer
# SA PROPRE fiche) et surtout PAS par l'API Places : les conditions Google Maps
# Platform, article 3.2.3(a), interdisent de « copier et enregistrer les avis
# d'utilisateurs » — or c'est exactement ce que fait ce robot.
#
# Tant qu'aucune source n'est branchée, le script ne fait rien et le workflow
# reste vert : la rubrique s'affiche simplement sans avis.
#
# Deux façons d'alimenter la page :
#   1. Automatique — les trois secrets GBP_* ci-dessous.
#   2. Manuelle, disponible tout de suite — un export Google Takeout de la
#      fiche, déposé dans data/avis_source.json.
#
# Secrets attendus (mode automatique) :
#   GBP_CLIENT_ID       identifiant OAuth « application de bureau »
#   GBP_CLIENT_SECRET   son secret
#   GBP_REFRESH_TOKEN   jeton long, obtenu une seule fois avec
#                       « python scripts/avis_jeton.py »
#   GBP_ACCOUNT_ID      facultatif — évite un appel à une API dont le quota
#   GBP_LOCATION_ID     facultatif   se demande séparément (piège classique)

on:
  schedule:
    - cron: "20 5 * * *"   # 05:20 UTC, 20 min après l'agenda pour ne pas se croiser
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_avis.py"
      - ".github/workflows/avis.yml"
      - "data/avis_source.json"

permissions:
  contents: write

concurrency:
  group: avis-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer les avis
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
        run: python scripts/update_avis.py

      - name: Commit si changement
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name  "jammerz-avis-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "chore(avis): maj auto des avis Google"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Avis mis à jour et poussés."
          else
            echo "Rien à mettre à jour."
          fi
